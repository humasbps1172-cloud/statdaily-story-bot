name: Perpanjang token Instagram

on:
  schedule:
    - cron: "0 3 * * 1"   # tiap Senin, 10.00 WIB
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Perpanjang token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/refresh_token.py
