name: Tayangkan carousel Instagram

on:
  schedule:
    # Sekali sehari. Tiap jalan menayangkan 1 carousel (subfolder tertua di queue_carousel/).
    # 19.37 WIB -> 12.37 UTC
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Jumlah carousel yang ditayangkan sekarang"
        default: "1"
      dry_run:
        description: "Uji saja, jangan tayang (hilangkan centang untuk tayang sungguhan)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-carousel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tayangkan carousel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MAX_PER_RUN: ${{ github.event.inputs.count || '1' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '' }}
        run: python scripts/publish_carousel.py

      - name: Simpan yang sudah tayang
        if: always()
        run: |
          git config user.name "stat-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A queue_carousel
          if ! git diff --cached --quiet; then
            git commit -m "Hapus carousel yang sudah tayang"
            for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
          fi
