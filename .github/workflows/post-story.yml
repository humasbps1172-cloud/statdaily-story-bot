name: Tayangkan story Instagram

on:
  schedule:
    # Lima kali sehari, tiap hari. Tiap jalan menayangkan 1 story (file tertua di queue/).
    # Cron GitHub telat rata-rata ~50 menit (diukur 42 run, rentang 38-60), jadi cron = jam target - 50 menit.
    # Target tayang WIB -> cron UTC: 08.00 -> 00.10 | 11.00 -> 03.10 | 13.30 -> 05.40 | 17.00 -> 09.10 | 20.00 -> 12.10
    - cron: "10 0 * * *"
    - cron: "10 3 * * *"
    - cron: "40 5 * * *"
    - cron: "10 9 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Jumlah story yang ditayangkan sekarang"
        default: "1"
      dry_run:
        description: "Uji saja, jangan tayang (hilangkan centang untuk tayang sungguhan)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tayangkan story
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
          MAX_PER_RUN: ${{ github.event.inputs.count || '1' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '' }}
        run: python scripts/publish_story.py

      - name: Simpan yang sudah tayang
        if: always()
        run: |
          git config user.name "stat-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A queue
          git diff --cached --quiet || (git commit -m "Hapus story yang sudah tayang" && git push)
